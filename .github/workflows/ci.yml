name: CI

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: test -z "$(gofmt -l cmd/gitu/main.go cmd/gitu/main_test.go)"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/gitu
